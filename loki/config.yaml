auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /tmp/loki

schema_config:
  configs:
    - from: 2020-05-15
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /tmp/loki/boltdb-shipper-active
    cache_location: /tmp/loki/boltdb-shipper-cache
  filesystem:
    directory: /tmp/loki/chunks

compactor:
  working_directory: /loki/compactor
  compaction_interval: 2m      # short for the lab; production would use 10m+
  retention_enabled: true
  retention_delete_delay: 0m    # no grace window — lab only, never do this in prod
  delete_request_store: filesystem

# Guardrails – per‑tenant limits
limits_config:
  retention_period: 24h
  max_streams_per_user: 10000
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  allow_structured_metadata: false 

runtime_config:
  file: /etc/loki/runtime-overrides.yaml
  period: 10s