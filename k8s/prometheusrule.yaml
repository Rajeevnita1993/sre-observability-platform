apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: order-pipeline-rules
  namespace: monitoring        # CHANGED — required by ruleNamespaceSelector={}
  labels:
    release: kps               # CHANGED — required by ruleSelector
spec:
  groups:
    - name: http_slis
      interval: 30s
      rules:
        - record: job:http_requests:rate5m
          expr: sum by (job) (rate(http_requests_total[5m]))
        - record: job:http_error_ratio:ratio5m
          expr: |
            sum by (job) (rate(http_requests_total{status=~"5.."}[5m]))
              /
            sum by (job) (rate(http_requests_total[5m]))
        - record: job:http_request_duration_seconds:p95
          expr: |
            histogram_quantile(0.95,
              sum by (le, job) (rate(http_request_duration_seconds_bucket[5m])))
    - name: service_alerts
      rules:
        - alert: HighErrorRatio
          expr: job:http_error_ratio:ratio5m{job="api"} > 0.05
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "High 5xx ratio on {{ $labels.job }}"
        - alert: SqsBacklogGrowing
          expr: sqs_queue_depth{queue="orders-queue"} > 100
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: "SQS backlog on {{ $labels.queue }}"
        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(s3_write_duration_bucket{job="worker"}[5m]))) > 2
          for: 5m
          labels:
            severity: warning
            queue: orders-queue
          annotations:
            summary: "p95 write latency high on {{ $labels.queue }}"
            description: "p95 is {{ $value }}s (>2s) for 5m — worker may be struggling."