apiVersion: v1
kind: ConfigMap
metadata: { name: worker-config }
data:
  AWS_ENDPOINT: "http://localstack:4566"
  AWS_REGION: "us-east-1"
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  QUEUE_URL: "http://localstack:4566/000000000000/orders-queue"
  RESULT_BUCKET: "order-results"
  OTEL_SERVICE_NAME: "worker"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-gateway-opentelemetry-collector.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  PYROSCOPE_SERVER_ADDRESS: "http://pyroscope.observability.svc.cluster.local:4040"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, labels: { app: worker } }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata:
      labels:
        app: worker
      annotations:                             
        observability.io/team: checkout
    spec:
      containers:
        - name: worker
          image: obs-worker:day41
          imagePullPolicy: Never
          ports:
            - name: metrics       # NEW — required for PodMonitor
              containerPort: 9464
          envFrom: [{ configMapRef: { name: worker-config } }]
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    app: worker       
spec:
  selector:
    app: worker
  ports:
    - name: metrics   
      port: 9464
      targetPort: 9464