apiVersion: apps/v1
kind: Deployment
metadata: { name: localstack, labels: { app: localstack } }
spec:
  replicas: 1
  selector: { matchLabels: { app: localstack } }
  template:
    metadata: { labels: { app: localstack } }
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.7
          ports: [{ containerPort: 4566 }]
          env:
            - { name: SERVICES, value: "sns,sqs,s3" }
            - { name: DEBUG, value: "0" }
---
apiVersion: v1
kind: Service
metadata: { name: localstack }
spec:
  selector: { app: localstack }
  ports: [{ port: 4566, targetPort: 4566 }]