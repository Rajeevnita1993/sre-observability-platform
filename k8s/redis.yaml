# redis.yaml — Deployment + Service, exporter as a sidecar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default
  labels: { app: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ name: redis, containerPort: 6379 }]
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0
          env:
            - { name: REDIS_ADDR, value: "redis://localhost:6379" }
          ports: [{ name: metrics, containerPort: 9121 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
  labels: { app: redis }
spec:
  selector: { app: redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
    - { name: metrics, port: 9121, targetPort: 9121 }