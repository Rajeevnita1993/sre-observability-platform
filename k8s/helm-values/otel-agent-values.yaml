mode: daemonset
image:
  repository: otel/opentelemetry-collector-contrib

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { cpu: 500m, memory: 256Mi }

config:
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133

  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
        http: { endpoint: 0.0.0.0:4318 }

  processors:
    memory_limiter:
      check_interval: 2s
      limit_mib: 256
      spike_limit_mib: 64
    batch:
      timeout: 5s
      send_batch_size: 2048

  exporters:
    otlp_grpc/gateway:
      endpoint: otel-gateway.observability.svc.cluster.local:4317
      tls: { insecure: true }

  service:
    extensions: [health_check]
    telemetry:
      metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
    pipelines:
      traces:  { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_grpc/gateway] }
      metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_grpc/gateway] }
      logs:    { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp_grpc/gateway] }