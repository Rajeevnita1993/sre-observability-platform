tempo:
  replicas: 1
  config: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    ingester:
      trace_idle_period: 30s
      flush_check_period: 5s
      complete_block_timeout: 60s
      max_block_duration: 1m
      max_block_bytes: 524288000

    compactor:
      compaction:
        block_retention: 24h
        compacted_block_retention: 1h
        compaction_cycle: 30s

    metrics_generator:
      metrics_ingestion_time_range_slack: 120s
      registry:
        collection_interval: 15s
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: http://kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write
            send_exemplars: true
      processor:
        span_metrics:
          histogram_buckets: [0.002, 0.004, 0.008, 0.016, 0.032, 0.064, 0.128, 0.256, 0.512, 1.02, 2.05, 4.10]
          dimensions:
            - http.method
            - http.status_code
            - messaging.system
        service_graphs:
          histogram_buckets: [0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 6.4]
          peer_attributes:
            - peer.service
            - messaging.destination.name
          dimensions:
            - messaging.system
          wait: 10s
          max_items: 10000

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
        blocklist_poll: 30s

    overrides:
      defaults:
        metrics_generator:
          processors: [span-metrics, service-graphs]
          generate_native_histograms: both

    usage_report:
      reporting_enabled: false

persistence:
  enabled: true
  storageClassName: standard
  size: 5Gi