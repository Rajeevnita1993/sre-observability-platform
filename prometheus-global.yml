# prometheus-global.yml
global:
  scrape_interval: 30s
  external_labels:
    tier: 'global'

scrape_configs:
  - job_name: federate
    honor_labels: true
    metrics_path: /federate
    params:
      match[]:
        - '{__name__=~"job:.+"}'
    static_configs:
      - targets: ['prometheus-regional:9091']