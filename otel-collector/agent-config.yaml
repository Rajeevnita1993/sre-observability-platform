extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 2048

# otel-collector/agent-config.yaml
exporters:
  otlp/gateway:
    endpoint: otel-collector-gateway:4317  # was gateway-lb:4317
    tls:
      insecure: true

  loadbalancing:
    routing_key: "traceID"
    protocol:
      otlp:
        tls:
          insecure: true
    resolver:
      static:
        hostnames:
          - otel-collector-gateway:4317
          - otel-collector-gateway-2:4317

service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:  { receivers: [otlp], processors: [memory_limiter, batch], exporters: [loadbalancing] }
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/gateway] }
    logs:    { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/gateway] }