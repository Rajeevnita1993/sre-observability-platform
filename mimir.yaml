# mimir.yml
multitenancy_enabled: true

server:
  http_listen_port: 9009

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore: {store: inmemory}

ingester:
  ring:
    kvstore: {store: inmemory}
    replication_factor: 1

store_gateway:
  sharding_ring:
    kvstore: {store: inmemory}

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules