route:
  receiver: default-webhook
  group_by: ['alertname', 'queue']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: pager
      continue: false
    - match:
        severity: warning
      receiver: slack
      continue: false

receivers:
  - name: default-webhook
    webhook_configs:
      - url: 'http://localhost:5001/default'
        send_resolved: true

  - name: pager
    webhook_configs:
      - url: 'http://localhost:5001/pager'
        send_resolved: true

  - name: slack
    webhook_configs:
      - url: 'http://localhost:5001/slack'
        send_resolved: true

inhibit_rules:
  - source_match:
      alertname: SqsBacklogGrowing
      severity: critical
    target_match:
      alertname: HighLatency
      severity: warning
    equal: ['queue']