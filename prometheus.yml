global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/recording.rules.yml
  - /etc/prometheus/rules/alerts.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']


remote_write:
  - url: http://mimir:9009/api/v1/push
    headers:
      X-Scope-OrgID: team-checkout
    queue_config:
      capacity: 10000
      max_shards: 10
      max_samples_per_send: 2000
    
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9464"]

  - job_name: 'api'
    metrics_path: /metrics
    static_configs:
      - targets: ['api:8080']      # Correct port based on app.js
        labels:
          service: orders-api

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
