apiVersion: v1
kind: ConfigMap
metadata:
  name: db-health-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  db-health.json: |
    {
      "title": "Database Health — orders Postgres",
      "uid": "db-health-orders",
      "tags": ["postgres"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Connection saturation",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(pg_stat_activity_count{datname=\"orders\"}) / max(pg_settings_max_connections)",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green",  "value": null },
                  { "color": "yellow", "value": 0.6 },
                  { "color": "red",    "value": 0.8 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Slowest queries (mean exec time)",
          "type": "table",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "topk(5, pg_stat_statements_mean_exec_time)",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ms" },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "namespace": true,
                  "pod": true,
                  "server": true,
                  "service": true
                },
                "renameByName": {
                  "query": "query",
                  "Value": "mean (ms)"
                }
              }
            }
          ]
        },
        {
          "id": 3,
          "title": "Rows waiting on a lock",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "pg_locks_waiting", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" },
            "overrides": []
          }
        }
      ]
    }